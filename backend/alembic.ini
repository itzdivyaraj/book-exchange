# Alembic = database migrations.
# A migration is a small script that changes the database's tables (add a table, add a column...)
# WITHOUT deleting the data already in it. They run automatically when the server starts.
#
# Make a new migration after changing models.py (from the backend folder, venv active):
#     alembic revision --autogenerate -m "describe the change"
# then read the generated file in migrations/versions/ and restart the server.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# The database address comes from app/config.py (DATABASE_URL), not from this file.
